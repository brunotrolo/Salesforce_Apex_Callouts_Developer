  <text x="222" y="148" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#BCD5F0">Refatora callouts HTTP legados para a arquitetura de referencia &#8212; spec, codigo e deploy prontos.</text>

